---
- name: Install automatic updates
  hosts: server
  become: yes
  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: latest
        update_cache: yes

    - name: Enable the daily unattended-upgrade runs
      ansible.builtin.copy:
        src: unattended-upgrades/20auto-upgrades
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Add the Raspberry Pi origins and the automatic reboot
      ansible.builtin.copy:
        src: unattended-upgrades/52unattended-upgrades-bench-host
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-bench-host
        owner: root
        group: root
        mode: '0644'

    - name: Enable the apt timers that drive the daily runs
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
