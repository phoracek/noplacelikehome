---
- name: Create ansible user with sudo privileges
  hosts: server
  become: yes
  vars:
    # Connect as the Imager-created user (group_vars/server.yml); the plays
    # after this one run as the ansible user this one creates.
    ansible_user: "{{ bootstrap_user }}"
  tasks:
    - name: Create a new user
      user:
        name: ansible
        shell: /bin/bash
        state: present

    - name: Copy the keys
      authorized_key:
        user: ansible
        state: present
        manage_dir: yes
        key: "{{ lookup('file', ssh_public_key) }}"

    - name: Add user to sudo group
      user:
        name: ansible
        groups: sudo
        append: yes

    - name: Allow passwordless sudo for the user
      lineinfile:
        path: /etc/sudoers.d/ansible
        state: present
        line: 'ansible ALL=(ALL) NOPASSWD:ALL'
        create: yes
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
