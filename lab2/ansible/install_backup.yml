---
- name: Install daily homelab backup
  hosts: server
  become: yes
  tasks:
    - name: Ensure backup destination exists (root-only; holds 0600 secrets)
      ansible.builtin.file:
        path: /var/backups/homelab
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install backup script
      ansible.builtin.copy:
        src: files/backup/homelab-backup.sh
        dest: /usr/local/sbin/homelab-backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install backup systemd units
      ansible.builtin.copy:
        src: "files/backup/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - homelab-backup.service
        - homelab-backup.timer
      notify: Reload systemd

    - name: Apply pending systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the backup timer
      ansible.builtin.systemd_service:
        name: homelab-backup.timer
        state: started
        enabled: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
