---
# Unified service deployment for the homelab. Runs the app/service playbooks in
# the right order so a single `ansible-playbook deploy_services.yml` (re)deploys
# everything that serves traffic or runs a job on the T470s.
#
# Each imported playbook stays independently runnable on its own; this file is
# just the composed entry point. Host PREREQUISITES are deliberately NOT here —
# install_podman.yml / install_dnf_automatic.yml / update_dnf_packages.yml and
# the create_ansible_user.yml bootstrap are one-time or scheduled host setup, run
# them separately (see README "Provisioning").
#
# Ordering reflects the layers: backends first, shared ingress last.
#   1. deploy_services_ramus_mcp — the hardware MCP host service. Comes before
#      Caddy so its DNS-rebinding allowlist already trusts ramus-mcp.lab.pacmag.cz
#      when the proxy starts forwarding the real Host (otherwise Caddy gets a 421
#      until the service is redeployed).
#   2. deploy_services_containerized_applications — the containerised backends
#      (the Actions runners) AND the shared `forgejo` podman network they and
#      Caddy all join. The network must exist before Caddy, so it lives with
#      this play.
#   3. deploy_services_caddy — the shared TLS ingress. Runs LAST: every backend
#      must be up before the proxy forwards to it.
#   4. deploy_services_backups — the daily backup timer. Last of all; it only
#      tars the data the services write, so its timer is installed once they exist.
#
# Run as the ansible deploy user, and ensure the ansible.posix collection is
# present on the control node for the rsync step in deploy_services_ramus_mcp.yml:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.file -u ansible deploy_services.yml

- import_playbook: deploy_services_ramus_mcp.yml
- import_playbook: deploy_services_containerized_applications.yml
- import_playbook: deploy_services_caddy.yml
- import_playbook: deploy_services_backups.yml
