---
- name: Deploy Quadlet-managed containers
  hosts: server
  become: yes
  # Caddy (the shared TLS ingress) is deployed separately by deploy_services_caddy.yml,
  # which runs AFTER this play so every backend is up before the proxy forwards.
  # This play still owns the shared `forgejo` podman network that Caddy and the
  # backends both join — it must exist first, so it lives with the backends.
  vars:
    quadlet_dir: /etc/containers/systemd
    container_units:
      - forgejo
      - glances
      - dashy
  tasks:
    # Forgejo runs as USER_UID/USER_GID 1000 inside the container, so its
    # bind-mounted data dirs must be owned by uid/gid 1000 on the host (rootful
    # podman maps container uid 1000 to host uid 1000). Otherwise the git user
    # can't create gitea.db etc. and the installer fails with "unable to open
    # database file".
    - name: Ensure Forgejo data directories exist (owned by the git uid)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - /var/lib/homelab/forgejo/gitea
        - /var/lib/homelab/forgejo/git
        - /var/lib/homelab/forgejo/var

    # Dashy bind-mounts a single config file; its parent dir must exist on the
    # host before the unit starts (Podman won't create the bind-mount source).
    - name: Ensure Dashy data directory exists
      ansible.builtin.file:
        path: /var/lib/homelab/dashy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Dashy config
      ansible.builtin.copy:
        src: files/dashy/conf.yml
        dest: /var/lib/homelab/dashy/conf.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart dashy

    # Each Forgejo Actions runner bind-mounts /var/lib/homelab/<name> at /data
    # (its config.yml, action cache, workflow workdirs). Podman won't create the
    # bind-mount source, so the dir must exist — owned by the in-container runner
    # user (rootful Podman maps container UID 1000 to host UID 1000).
    - name: Ensure per-runner data dirs exist (owned by the runner uid)
      ansible.builtin.file:
        path: "/var/lib/homelab/{{ item.name }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install per-runner config.yml (entries with placeholder credentials are skipped)
      ansible.builtin.template:
        src: templates/forgejo-runner/config.yml.j2
        dest: "/var/lib/homelab/{{ runner.name }}/config.yml"
        owner: "1000"
        group: "1000"
        mode: "0600"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
      when:
        - runner.uuid != "PASTE_UUID_HERE"
        - runner.token != "PASTE_TOKEN_HERE"
      register: runner_config_files
      no_log: true

    # --- Quadlet units ---
    - name: Install network Quadlet unit
      ansible.builtin.copy:
        src: ../quadlet/forgejo.network
        dest: "{{ quadlet_dir }}/forgejo.network"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install container Quadlet units
      ansible.builtin.copy:
        src: "../quadlet/{{ item }}.container"
        dest: "{{ quadlet_dir }}/{{ item }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ container_units }}"
      register: quadlet_files
      notify: Reload systemd

    - name: Install per-runner Quadlet units (entries with placeholder credentials are skipped)
      # Runner Quadlets are generated, not copied, because the unit has to embed
      # each runner's chosen name (ContainerName, data Volume path). Everything
      # else about a runner — image, SELinux type, socket mount, labels — is
      # identical across runners, so it lives in the template.
      #
      # Skip placeholder entries: the unit's [Install] WantedBy= would otherwise
      # pull a credential-less runner in at the next boot, where it crash-loops
      # because no config.yml was written for it. Gate the unit on the same real-
      # credentials check as the config.yml above so an un-filled entry leaves no
      # unit behind at all.
      ansible.builtin.template:
        src: templates/forgejo-runner/runner.container.j2
        dest: "{{ quadlet_dir }}/{{ runner.name }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
      when:
        - runner.uuid != "PASTE_UUID_HERE"
        - runner.token != "PASTE_TOKEN_HERE"
      register: runner_quadlet_files
      notify: Reload systemd

    # Run pending handlers (image build, daemon-reload) before starting units,
    # so the custom image exists and systemd sees the latest unit files.
    - name: Apply pending image build and systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Start network
      ansible.builtin.systemd_service:
        name: forgejo-network.service
        state: started

    - name: Start container services
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: started
        enabled: false
      loop: "{{ container_units }}"

    - name: Restart services whose Quadlet unit changed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        state: restarted
      loop: "{{ quadlet_files.results }}"
      when: item.changed
      loop_control:
        label: "{{ item.item }}"

    - name: Start each runner once its credentials are configured
      # WantedBy= in the unit handles auto-start at boot; this start is for the
      # first deploy after credentials are filled in. Entries still on the
      # PASTE_* placeholders have no config.yml and are skipped.
      ansible.builtin.systemd_service:
        name: "{{ item.name }}.service"
        state: started
      loop: "{{ forgejo_runners | default([]) }}"
      when:
        - item.uuid != "PASTE_UUID_HERE"
        - item.token != "PASTE_TOKEN_HERE"
      loop_control:
        label: "{{ item.name }}"

    - name: Restart runners whose Quadlet changed (only if their credentials are real)
      ansible.builtin.systemd_service:
        name: "{{ item.runner.name }}.service"
        state: restarted
      loop: "{{ runner_quadlet_files.results | default([]) }}"
      when: item.changed | default(false)
      loop_control:
        label: "{{ item.runner.name }}"

    - name: Restart runners whose config.yml changed (only if their credentials are real)
      # forgejo-runner reads its config only at startup, so a rewritten config.yml
      # (e.g. a rotated token or changed labels) has no effect until the daemon
      # restarts. The 'Start each runner' task above is a no-op on an already-
      # running unit, so without this an in-place credential change would silently
      # keep using the stale config. Skipped (placeholder) entries register
      # changed=false, so they're filtered out by the same check.
      ansible.builtin.systemd_service:
        name: "{{ item.runner.name }}.service"
        state: restarted
      loop: "{{ runner_config_files.results | default([]) }}"
      when: item.changed | default(false)
      loop_control:
        label: "{{ item.runner.name }}"
      no_log: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart dashy
      ansible.builtin.systemd_service:
        name: dashy.service
        state: restarted
      failed_when: false
