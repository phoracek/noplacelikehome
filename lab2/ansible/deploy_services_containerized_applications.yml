---
- name: Deploy Quadlet-managed containers
  hosts: server
  become: yes
  # Caddy (the shared TLS ingress) is deployed separately by deploy_services_caddy.yml,
  # which runs AFTER this play so every backend is up before the proxy forwards.
  # This play owns the shared `forgejo` podman network. Caddy is its only member,
  # but it must exist before Caddy starts, so it lives here; renaming it would
  # mean recreating the network, which is churn for no gain.
  #
  # `container_units` is empty rather than deleted: nothing on this host is a
  # plain container any more, and this list is where one would go.
  vars:
    quadlet_dir: /etc/containers/systemd
    container_units: []
  tasks:
    # --- Quadlet units ---
    - name: Install network Quadlet unit
      ansible.builtin.copy:
        src: ../quadlet/forgejo.network
        dest: "{{ quadlet_dir }}/forgejo.network"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install container Quadlet units
      ansible.builtin.copy:
        src: "../quadlet/{{ item }}.container"
        dest: "{{ quadlet_dir }}/{{ item }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ container_units }}"
      register: quadlet_files
      notify: Reload systemd

    # Run pending handlers (image build, daemon-reload) before starting units,
    # so the custom image exists and systemd sees the latest unit files.
    - name: Apply pending image build and systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Start network
      ansible.builtin.systemd_service:
        name: forgejo-network.service
        state: started

    # No `enabled:` — Quadlet generates these units, so systemctl cannot enable
    # or disable them; their [Install] section is what the generator turns into
    # wants-symlinks on every daemon-reload.
    - name: Start container services
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: started
      loop: "{{ container_units }}"

    - name: Restart services whose Quadlet unit changed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        state: restarted
      # `| default([])` because an empty container_units makes the install task
      # above skip and register no `results` key at all.
      loop: "{{ quadlet_files.results | default([]) }}"
      when: item.changed
      loop_control:
        label: "{{ item.item }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
