---
# Caddy — the shared TLS ingress that every internal service sits behind. Pulled
# out of deploy_services_containerized_applications.yml because Caddy is a different layer from the apps:
# one reverse proxy fronts all of them (Forgejo, Glances, Dashy, the ramus-mcp
# host service), terminating TLS and routing by hostname. Keeping it separate
# means an app deploy doesn't rebuild/restart the proxy, and the proxy can be
# (re)deployed on its own.
#
# Runs LAST among the service playbooks (see deploy_services.yml): every backend
# must be up before the ingress starts forwarding to it. In particular the
# ramus-mcp host service must already be running so its DNS-rebinding allowlist
# trusts the public hostname before Caddy forwards the real Host header.
#
# Prerequisite: the shared `forgejo` podman network (installed + started by
# deploy_services_containerized_applications.yml). Caddy joins it to reach the containerised backends; its
# Quadlet unit declares the dependency, so a daemon-reload here will pull the
# network up as long as deploy_services_containerized_applications.yml has installed the network unit.
#
# The routing table is still a single Caddyfile (files/caddy/Caddyfile) listing
# every service's vhost — this play owns that file and Caddy's image/secrets.
- name: Deploy Caddy reverse proxy (shared TLS ingress)
  hosts: server
  become: yes
  vars:
    quadlet_dir: /etc/containers/systemd
    caddy_build_dir: /var/lib/homelab/caddy/build
    caddy_image: localhost/caddy-wedos:latest
  tasks:
    # Podman does not create missing bind-mount source directories, so Caddy's
    # cert/config dirs must exist before the unit starts.
    - name: Ensure Caddy data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/homelab/caddy/data
        - /var/lib/homelab/caddy/config

    # --- Custom Caddy image (bundles the vendored WEDOS DNS provider) ---
    - name: Ensure Caddy build directory exists
      ansible.builtin.file:
        path: "{{ caddy_build_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Caddy Containerfile
      ansible.builtin.copy:
        src: files/caddy/Containerfile
        dest: "{{ caddy_build_dir }}/Containerfile"
        owner: root
        group: root
        mode: "0644"
      register: caddy_containerfile

    - name: Copy vendored WEDOS DNS provider module
      ansible.builtin.copy:
        src: files/caddy/caddy-wedos/
        dest: "{{ caddy_build_dir }}/caddy-wedos/"
        owner: root
        group: root
        mode: "0644"
      register: caddy_wedos_src

    - name: Check whether the custom Caddy image already exists
      ansible.builtin.command:
        cmd: "podman image exists {{ caddy_image }}"
      register: caddy_image_present
      changed_when: false
      failed_when: false

    - name: Build the custom Caddy image
      ansible.builtin.command:
        cmd: "podman build -t {{ caddy_image }} {{ caddy_build_dir }}"
      when: >
        caddy_containerfile.changed
        or caddy_wedos_src.changed
        or caddy_image_present.rc != 0
      register: caddy_build
      changed_when: caddy_build.rc == 0
      notify: Restart caddy

    # --- Caddy runtime config + secrets ---
    # These env files carry per-service auth Caddy enforces at the edge; they live
    # with Caddy (the enforcer), templated from the gitignored group_vars.
    - name: Deploy WEDOS WAPI environment file
      ansible.builtin.template:
        src: templates/caddy/wedos.env.j2
        dest: /var/lib/homelab/caddy/wedos.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart caddy

    - name: Deploy ramus-mcp basic-auth environment file
      ansible.builtin.template:
        src: templates/caddy/ramus-mcp.env.j2
        dest: /var/lib/homelab/caddy/ramus-mcp.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart caddy

    - name: Install Caddyfile
      ansible.builtin.copy:
        src: files/caddy/Caddyfile
        dest: /var/lib/homelab/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
      notify: Restart caddy

    # --- Quadlet unit ---
    - name: Install Caddy Quadlet unit
      ansible.builtin.copy:
        src: ../quadlet/caddy.container
        dest: "{{ quadlet_dir }}/caddy.container"
        owner: root
        group: root
        mode: "0644"
      register: caddy_quadlet_file
      notify: Reload systemd

    # Run pending handlers (image build, daemon-reload) before starting the unit,
    # so the custom image exists and systemd sees the latest unit file.
    - name: Apply pending image build and systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Start Caddy
      ansible.builtin.systemd_service:
        name: caddy.service
        state: started
        enabled: false

    - name: Restart Caddy if its Quadlet unit changed
      ansible.builtin.systemd_service:
        name: caddy.service
        state: restarted
      when: caddy_quadlet_file.changed

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart caddy
      ansible.builtin.systemd_service:
        name: caddy.service
        state: restarted
      failed_when: false
