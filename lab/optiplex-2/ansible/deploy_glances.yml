---
# See ../README.md#glances.
- name: Deploy Glances
  hosts: server
  become: yes
  vars:
    quadlet_dir: /etc/containers/systemd
    # The OptiPlex's Caddy.
    glances_proxy: 192.168.0.252
  tasks:
    - name: Ensure the Glances config directory exists
      ansible.builtin.file:
        path: /etc/glances
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the Glances config
      ansible.builtin.copy:
        src: files/glances/glances.conf
        dest: /etc/glances/glances.conf
        owner: root
        group: root
        mode: '0644'
      register: glances_conf

    - name: Install the Glances Quadlet unit
      ansible.builtin.copy:
        src: ../quadlet/glances.container
        dest: "{{ quadlet_dir }}/glances.container"
        owner: root
        group: root
        mode: '0644'
      register: glances_unit

    - name: Reload systemd so Quadlet regenerates the unit
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: glances_unit is changed

    - name: Start Glances
      ansible.builtin.systemd_service:
        name: glances.service
        state: "{{ 'restarted' if glances_unit is changed or glances_conf is changed else 'started' }}"

    - name: Open 61208 to the OptiPlex's Caddy only
      ansible.posix.firewalld:
        rich_rule: rule family="ipv4" source address="{{ glances_proxy }}" port port="61208" protocol="tcp" accept
        permanent: true
        immediate: true
        state: enabled

    # For AutoUpdate=registry.
    - name: Enable the podman auto-update timer
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        state: started
        enabled: true
