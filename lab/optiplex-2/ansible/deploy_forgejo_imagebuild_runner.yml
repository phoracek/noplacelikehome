---
# The image-build runner. See ../README.md#forgejo-runners.
# Needs deploy_forgejo_runners.yml first: the runner binary and cache server.
- name: Deploy the image-build runner
  hosts: server
  become: yes
  vars:
    imagebuild_user: forgejo-imagebuild
    imagebuild_home: /home/forgejo-imagebuild
    cache_server_port: 4000
    cache_secret_path: /home/forgejo-runner/.config/forgejo-cache/secret
    imagebuild_configured: >-
      {{ forgejo_imagebuild_runner is defined
         and forgejo_imagebuild_runner.uuid != "PASTE_UUID_HERE"
         and forgejo_imagebuild_runner.token != "PASTE_TOKEN_HERE" }}
  tasks:
    - name: Require the runner binary and the shared cache secret
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/bin/forgejo-runner
        - "{{ cache_secret_path }}"
      register: prerequisites
      failed_when: not prerequisites.stat.exists

    # JavaScript actions run on the host's node.
    - name: Install what host-executor jobs need
      ansible.builtin.dnf:
        name:
          - acl
          - podman
          - git
          - nodejs
          - bash
        state: present

    - name: Create the forgejo-imagebuild system user
      ansible.builtin.user:
        name: "{{ imagebuild_user }}"
        system: true
        home: "{{ imagebuild_home }}"
        create_home: true
        shell: /sbin/nologin
        groups: []
        comment: Forgejo Actions image builds (rootless Podman)

    - name: Look up the user's uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ imagebuild_user }}"

    - name: Record the uid and the user-manager environment
      ansible.builtin.set_fact:
        imagebuild_uid: "{{ ansible_facts.getent_passwd[imagebuild_user][1] }}"
        imagebuild_env:
          XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[imagebuild_user][1] }}"
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[imagebuild_user][1] }}/bus"

    # useradd --system allocates none. The range starts past every existing one.
    - name: Give the user subordinate uid/gid ranges
      ansible.builtin.shell:
        cmd: |
          set -eu
          u={{ imagebuild_user }}
          if grep -q "^$u:" /etc/subuid && grep -q "^$u:" /etc/subgid; then
            echo unchanged
            exit 0
          fi
          start=$(cat /etc/subuid /etc/subgid 2>/dev/null \
            | awk -F: 'BEGIN { m = 200000 } { e = $2 + $3; if (e > m) m = e } END { print m }')
          usermod --add-subuids "$start-$((start + 65535))" \
                  --add-subgids "$start-$((start + 65535))" "$u"
      register: imagebuild_subids
      changed_when: "'unchanged' not in imagebuild_subids.stdout"

    - name: Enable lingering, so the user manager and /run/user/<uid> exist without a login
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ imagebuild_user }}
        creates: /var/lib/systemd/linger/{{ imagebuild_user }}

    - name: Wait for the user manager's bus
      ansible.builtin.wait_for:
        path: "/run/user/{{ imagebuild_uid }}/bus"
        timeout: 30

    - name: Ensure the user's directories exist
      ansible.builtin.file:
        path: "{{ imagebuild_home }}/{{ item }}"
        state: directory
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0700"
      loop:
        - .config
        - .config/containers
        - .config/forgejo-runner
        - .config/systemd
        - .config/systemd/user
        - .cache
        - .cache/act
        - .cache/containers-tmp

    - name: Pin native overlay for the user's layer store
      ansible.builtin.copy:
        src: files/forgejo-imagebuild/storage.conf
        dest: "{{ imagebuild_home }}/.config/containers/storage.conf"
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0644"
      register: imagebuild_storage_conf

    - name: Keep image pulls off the root filesystem
      ansible.builtin.template:
        src: templates/containers.conf.j2
        dest: "{{ imagebuild_home }}/.config/containers/containers.conf"
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0644"
      vars:
        podman_user: "{{ imagebuild_user }}"
        podman_home: "{{ imagebuild_home }}"

    - name: Let rootless Podman pick up new subordinate ids or storage config
      ansible.builtin.command:
        cmd: podman system migrate
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      when: imagebuild_subids.changed or imagebuild_storage_conf.changed

    - name: Read the user's Podman storage info
      ansible.builtin.command:
        cmd: podman info --format json
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      register: imagebuild_podman_info
      changed_when: false

    - name: Require native overlay (not vfs, not fuse-overlayfs)
      ansible.builtin.assert:
        that:
          - (imagebuild_podman_info.stdout | from_json).store.graphDriverName == 'overlay'
          - "'overlay.mount_program' not in ((imagebuild_podman_info.stdout | from_json).store.graphOptions | default({}, true))"
        fail_msg: >-
          Rootless storage is
          {{ (imagebuild_podman_info.stdout | from_json).store.graphDriverName }}
          with options {{ (imagebuild_podman_info.stdout | from_json).store.graphOptions }}.

    - name: Smoke-test a rootless pull and container
      ansible.builtin.command:
        cmd: podman run --rm --pull=always registry.fedoraproject.org/fedora:44 true
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      changed_when: false

    - name: Give the runner a copy of the shared cache secret
      ansible.builtin.copy:
        src: "{{ cache_secret_path }}"
        remote_src: true
        dest: "{{ imagebuild_home }}/.config/forgejo-runner/cache-secret"
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0600"
      notify: Restart imagebuild runner

    - name: Install the runner's config.yml
      ansible.builtin.template:
        src: templates/forgejo-imagebuild/config.yml.j2
        dest: "{{ imagebuild_home }}/.config/forgejo-runner/config.yml"
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0600"
      when: imagebuild_configured | bool
      notify: Restart imagebuild runner
      no_log: true

    - name: Install the user units
      ansible.builtin.copy:
        src: "files/forgejo-imagebuild/{{ item }}"
        dest: "{{ imagebuild_home }}/.config/systemd/user/{{ item }}"
        owner: "{{ imagebuild_user }}"
        group: "{{ imagebuild_user }}"
        mode: "0644"
      loop:
        - forgejo-runner.service
        - podman-prune.service
        - podman-prune.timer
      register: imagebuild_units
      notify: Restart imagebuild runner

    - name: Reload the user manager
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      when: imagebuild_units.changed

    - name: Enable and start the weekly layer store prune
      ansible.builtin.systemd_service:
        name: podman-prune.timer
        scope: user
        enabled: true
        state: started
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"

    - name: Enable and start the runner once its credentials are configured
      ansible.builtin.systemd_service:
        name: forgejo-runner.service
        scope: user
        enabled: true
        state: started
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      when: imagebuild_configured | bool
      register: imagebuild_runner_started

  handlers:
    # Restarting cancels the running build.
    - name: Restart imagebuild runner
      ansible.builtin.systemd_service:
        name: forgejo-runner.service
        scope: user
        state: restarted
      become_user: "{{ imagebuild_user }}"
      environment: "{{ imagebuild_env }}"
      when:
        - imagebuild_configured | bool
        - not (imagebuild_runner_started.changed | default(false))
