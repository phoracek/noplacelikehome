---
- name: Install automatic updates
  hosts: server
  become: yes
  tasks:
    - name: Install dnf-automatic
      ansible.builtin.dnf:
        name: dnf-automatic
        state: latest

    # The default only downloads.
    - name: Apply updates and reboot when they need it
      community.general.ini_file:
        path: /etc/dnf/automatic.conf
        section: commands
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0644'
      loop:
        - { option: apply_updates, value: "yes" }
        - { option: reboot, value: when-needed }

    - name: Enable a timer unit for dnf-automatic
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
        state: started
        enabled: true
