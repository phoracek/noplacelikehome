---
- name: Deploy Quadlet container units
  hosts: server
  become: yes
  vars:
    quadlet_dir: /etc/containers/systemd
    systemd_dir: /etc/systemd/system
    quadlet_units:
      - mosquitto
      - zigbee2mqtt
      - homeassistant
      - clouds-over-czechoslovakia
      - clouds-over-czechoslovakia-server
      - dashy
      - glances
      - pairdrop
      - joplin-server
      - forgejo
      - pages
    long_running_units:
      - mosquitto
      - zigbee2mqtt
      - homeassistant
      - clouds-over-czechoslovakia-server
      - dashy
      - glances
      - pairdrop
      - joplin-server
      - forgejo
      - pages
    systemd_timers:
      - clouds-over-czechoslovakia
  tasks:
    - name: Ensure quadlet directory exists
      ansible.builtin.file:
        path: "{{ quadlet_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install Quadlet container units
      ansible.builtin.copy:
        src: "../quadlet/{{ item }}.container"
        dest: "{{ quadlet_dir }}/{{ item }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ quadlet_units }}"
      register: quadlet_files

    - name: Install per-runner Quadlet units
      # Runner Quadlets are generated, not copied, because the unit has
      # to embed each runner's chosen name (ContainerName, data Volume
      # path). Everything else about a runner — image, SELinux type,
      # socket mount, labels — is identical across runners.
      ansible.builtin.template:
        src: templates/forgejo-runner/runner.container.j2
        dest: "{{ quadlet_dir }}/{{ runner.name }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
      register: runner_quadlet_files

    - name: Install systemd timer units
      ansible.builtin.copy:
        src: "files/systemd/{{ item }}.timer"
        dest: "{{ systemd_dir }}/{{ item }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ systemd_timers }}"
      register: timer_files

    - name: Reload systemd to pick up Quadlet/timer changes
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: quadlet_files.changed or timer_files.changed or runner_quadlet_files.changed

    - name: Start long-running container services
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: started
        enabled: false
      loop: "{{ long_running_units }}"

    - name: Restart long-running services if their unit changed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        state: restarted
      loop: "{{ quadlet_files.results }}"
      when: item.changed and item.item in long_running_units
      loop_control:
        label: "{{ item.item }}"

    - name: Restart runners whose Quadlet changed (only if their credentials are real)
      ansible.builtin.systemd_service:
        name: "{{ item.runner.name }}.service"
        state: restarted
      loop: "{{ runner_quadlet_files.results | default([]) }}"
      when:
        - item.changed
        - item.runner.uuid != "PASTE_UUID_HERE"
        - item.runner.token != "PASTE_TOKEN_HERE"
      loop_control:
        label: "{{ item.runner.name }}"

    - name: Enable and start systemd timers
      ansible.builtin.systemd_service:
        name: "{{ item }}.timer"
        state: started
        enabled: true
      loop: "{{ systemd_timers }}"

    - name: Start each runner once its credentials are configured
      ansible.builtin.systemd_service:
        name: "{{ item.name }}.service"
        state: started
      loop: "{{ forgejo_runners | default([]) }}"
      when:
        - item.uuid != "PASTE_UUID_HERE"
        - item.token != "PASTE_TOKEN_HERE"
      loop_control:
        label: "{{ item.name }}"
