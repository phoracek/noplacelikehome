---
- name: Install Podman and prepare host for Quadlet-managed containers
  hosts: server
  become: yes
  tasks:
    - name: Install podman
      ansible.builtin.dnf:
        name:
          - podman
          - firewalld
        state: present

    - name: Enable podman auto-update timer
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        state: started
        enabled: true

    - name: Create homelab data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/homelab
        - /var/lib/homelab/homeassistant
        - /var/lib/homelab/zigbee2mqtt
        - /var/lib/homelab/clouds-over-czechoslovakia
        - /var/lib/homelab/dashy
        - /var/lib/homelab/mosquitto
        - /var/lib/homelab/mosquitto/config
        - /var/lib/homelab/mosquitto/data
        - /var/lib/homelab/mosquitto/log

    - name: Install Dashy configuration
      ansible.builtin.copy:
        src: files/dashy/conf.yml
        dest: /var/lib/homelab/dashy/conf.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart dashy

    - name: Install mosquitto configuration
      ansible.builtin.copy:
        src: files/mosquitto/mosquitto.conf
        dest: /var/lib/homelab/mosquitto/config/mosquitto.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart mosquitto

    - name: Own mosquitto data/log to the in-container mosquitto user (UID 1883)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1883"
        group: "1883"
        mode: "0755"
        recurse: true
      loop:
        - /var/lib/homelab/mosquitto/data
        - /var/lib/homelab/mosquitto/log
      notify: Restart mosquitto

    - name: Seed Zigbee2MQTT configuration (skips the v2 onboarding wizard)
      ansible.builtin.copy:
        src: files/zigbee2mqtt/configuration.yaml
        dest: /var/lib/homelab/zigbee2mqtt/configuration.yaml
        owner: root
        group: root
        mode: "0644"
        force: false
      notify: Restart zigbee2mqtt

    - name: Install udev rule for Zigbee dongle
      ansible.builtin.copy:
        src: files/udev/99-zigbee.rules
        dest: /etc/udev/rules.d/99-zigbee.rules
        owner: root
        group: root
        mode: "0644"
      register: zigbee_udev

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      when: zigbee_udev.changed

    - name: Trigger udev for tty subsystem
      ansible.builtin.command: udevadm trigger --subsystem-match=tty
      when: zigbee_udev.changed

    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Open firewall ports for Home Assistant and Zigbee2MQTT
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 8123/tcp
        - 8124/tcp
        - 8125/tcp
        - 8126/tcp
        - 8127/tcp
        - 61208/tcp

  handlers:
    - name: Restart dashy
      ansible.builtin.systemd_service:
        name: dashy.service
        state: restarted
      failed_when: false

    - name: Restart mosquitto
      ansible.builtin.systemd_service:
        name: mosquitto.service
        state: restarted
      failed_when: false

    - name: Restart zigbee2mqtt
      ansible.builtin.systemd_service:
        name: zigbee2mqtt.service
        state: restarted
      failed_when: false
