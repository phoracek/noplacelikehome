---
# Generic host prep for a Quadlet-managed container host. Nothing here is
# specific to any one service — per-service directories, secrets, and firewall
# ports live with the play that deploys the service.
- name: Install Podman and prepare host for Quadlet-managed containers
  hosts: server
  become: yes
  tasks:
    - name: Enable EPEL (nss-mdns lives there on AlmaLinux 9)
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install podman, avahi, and nss-mdns
      # nss-mdns is what lets the host's own libc resolve <hostname>.local back
      # to itself. avahi alone only *advertises* the name to the LAN — without
      # nss-mdns anything on the host that dials a service by that name hits the
      # LAN DNS server and fails.
      ansible.builtin.dnf:
        name:
          - podman
          - firewalld
          - avahi
          - nss-mdns
          - chrony
        state: present

    - name: Enable chronyd (keeps the host clock in sync)
      ansible.builtin.systemd_service:
        name: chronyd.service
        state: started
        enabled: true

    - name: Enable avahi-daemon (advertises <hostname>.local via mDNS)
      ansible.builtin.systemd_service:
        name: avahi-daemon.service
        state: started
        enabled: true

    - name: Wire mdns4_minimal into /etc/nsswitch.conf hosts line
      # The nss-mdns RPM doesn't touch nsswitch on its own; without this line the
      # .so is installed but never consulted. The negative lookahead keeps it
      # idempotent.
      ansible.builtin.replace:
        path: /etc/nsswitch.conf
        regexp: '^(hosts:\s+files)(?!.*mdns4_minimal)(.*)$'
        replace: '\1 mdns4_minimal [NOTFOUND=return]\2'

    - name: Enable podman auto-update timer
      ansible.builtin.systemd_service:
        name: podman-auto-update.timer
        state: started
        enabled: true

    # --- Rootful Podman API socket, used by the Forgejo Actions runners to
    # --- spawn job containers as siblings on this host.
    - name: Create podman-users group (fixed GID for socket access by forgejo-runner)
      ansible.builtin.group:
        name: podman-users
        gid: 980
        system: true
        state: present

    - name: Ensure podman.socket drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/podman.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Drop-in to gate podman.socket behind the podman-users group
      # The runner container runs as a non-root user but needs to reach the
      # rootful Podman socket. Default ownership is root:root 0660, so move the
      # group to podman-users (GID 980); the runner Quadlet picks that GID up via
      # GroupAdd=980. The socket stays unreadable to everyone else on the host.
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman.socket.d/override.conf
        content: |
          [Socket]
          SocketMode=0660
          SocketGroup=podman-users
        owner: root
        group: root
        mode: "0644"
      register: podman_socket_override

    - name: Reload systemd if podman.socket drop-in changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: podman_socket_override.changed

    - name: Restart podman.socket if its drop-in changed
      ansible.builtin.systemd_service:
        name: podman.socket
        state: restarted
      when: podman_socket_override.changed

    - name: Enable the rootful Podman API socket (used by forgejo-runner)
      ansible.builtin.systemd_service:
        name: podman.socket
        state: started
        enabled: true

    - name: Create the homelab data root
      # Every service's persistent state lives under here, one subdirectory per
      # service, created by the play that deploys it.
      ansible.builtin.file:
        path: /var/lib/homelab
        state: directory
        owner: root
        group: root
        mode: "0755"

    # --- CPU/IO isolation between host services and Forgejo's CI job containers ---
    # Forgejo Actions job containers aren't started as systemd units — act_runner
    # creates them directly over the Podman socket, so Podman drops them into
    # machine.slice, a *sibling* of system.slice (where every Quadlet-managed
    # service here lives) at the cgroup root. The root cgroup splits CPU/IO
    # between top-level slices by each slice's own weight (default 100 for
    # both), so a service's own CPUWeight= only reshuffles priority *within*
    # system.slice — it does nothing against machine.slice, which is the
    # contention that actually starves things during a busy CI run.
    #
    # Fixed two ways: system.slice is weighted well above machine.slice's
    # default, AND core 0 is carved out of machine.slice's cpuset entirely so
    # CI job containers can never land on it. Home Assistant, Zigbee2MQTT, and
    # Mosquitto pin themselves to that core in their own Quadlet units
    # (AllowedCPUs=0), guaranteeing the zigbee dongle's process gets scheduled
    # promptly no matter how loaded the rest of the host is.
    #
    # system.slice itself is deliberately left unrestricted (all 4 cores):
    # cgroup v2 cpuset is hierarchical, so a child can only narrow its parent's
    # allowed set, never widen it — restricting system.slice to cores 1-3 here
    # would make the pinned services' own AllowedCPUs=0 resolve to an *empty*
    # set (parent ∩ child) and leave them unschedulable on any CPU.
    - name: Ensure system.slice and machine.slice drop-in directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/systemd/system/system.slice.d
        - /etc/systemd/system/machine.slice.d

    - name: Weight system.slice above machine.slice for CPU/IO contention
      ansible.builtin.copy:
        dest: /etc/systemd/system/system.slice.d/override.conf
        content: |
          [Slice]
          CPUWeight=700
          IOWeight=700
        owner: root
        group: root
        mode: "0644"
      register: system_slice_override

    - name: Confine machine.slice (Forgejo job containers) off core 0
      ansible.builtin.copy:
        dest: /etc/systemd/system/machine.slice.d/override.conf
        content: |
          [Slice]
          AllowedCPUs=1-3
        owner: root
        group: root
        mode: "0644"
      register: machine_slice_override

    - name: Reload systemd if slice overrides changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: system_slice_override.changed or machine_slice_override.changed

    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Allow mDNS through firewalld so <hostname>.local resolves on the LAN
      ansible.posix.firewalld:
        service: mdns
        permanent: true
        immediate: true
        state: enabled

    - name: Re-apply netavark's firewall rules whenever firewalld reloads
      # A firewalld reload — `firewall-cmd --reload`, a firewalld restart, or the
      # package being updated under dnf-automatic — flushes the rules netavark
      # installs for every Podman network, and nothing puts them back. Containers
      # then can't reach the bridge gateway, so aardvark-dns stops answering and
      # every name lookup between containers times out. Caddy turns that into a
      # blanket 502 across all vhosts while the containers themselves look
      # perfectly healthy, which makes it a genuinely confusing failure.
      #
      # This unit ships with netavark, listens for firewalld's D-Bus reload
      # signal, and re-applies the rules. It is disabled by default. Without it
      # the manual recovery is `podman network reload --all`.
      ansible.builtin.systemd_service:
        name: netavark-firewalld-reload.service
        state: started
        enabled: true
