---
# Unified service deployment for the OptiPlex. Runs the service playbooks in the
# right order so a single `ansible-playbook deploy_services.yml` (re)deploys
# everything that serves traffic on this host.
#
# Each imported playbook stays independently runnable on its own; this file is
# just the composed entry point. Host PREREQUISITES are deliberately NOT here —
# install_podman.yml / install_dnf_automatic.yml / update_dnf_packages.yml and
# the create_ansible_user.yml bootstrap are one-time or scheduled host setup, run
# them separately (see README "Deploy").
#
# Ordering reflects the layers: backends first, shared ingress last.
#   1. deploy_services_containerized_applications — the containerised backends
#      AND the shared `homelab` podman network they and Caddy all join. The
#      network must exist before Caddy, so it lives with this play.
#   2. deploy_services_caddy — the shared TLS ingress. Runs LAST: every backend
#      must be up before the proxy forwards to it.
#
# Run as the ansible deploy user, and ensure the ansible.posix collection is
# present on the control node for the firewalld tasks:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook -i inventory.file -u ansible deploy_services.yml

- import_playbook: deploy_services_containerized_applications.yml
- import_playbook: deploy_services_caddy.yml
