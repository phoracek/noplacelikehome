# Rootless storage for forgejo-imagebuild. A user storage.conf replaces
# /etc/containers/storage.conf outright rather than merging with it, so this
# pins native kernel overlay: no vfs (a full copy per layer), and no
# mount_program, which would put every layer mount through fuse-overlayfs.
# Needs kernel 5.13+, which the playbook asserts.
[storage]
driver = "overlay"
