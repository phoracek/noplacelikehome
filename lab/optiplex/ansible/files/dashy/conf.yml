pageInfo:
  title: pacmag lab
  description: Home lab dashboard
  navLinks: []

appConfig:
  theme: nord-frost
  layout: auto
  iconSize: medium
  language: en
  statusCheck: true
  hideComponents:
    hideSettings: false

sections:
  # Services reached by hostname through Caddy.
  - name: Services
    icon: fas fa-server
    items:
      # VoidAuth is the SSO provider that gates the other tiles; listed first.
      # It isn't in the homelab-svg-assets set (hl-) the other tiles use, so point
      # at its own logo on the jsdelivr CDN by full URL, like Grist.
      - title: VoidAuth
        description: Single sign-on / auth provider
        icon: https://cdn.jsdelivr.net/gh/voidauth/voidauth@main/frontend/public/logo.svg
        url: https://auth.lab.pacmag.cz
        target: newtab

      - title: Forgejo
        description: Self-hosted Git forge
        icon: hl-forgejo
        url: https://forge.lab.pacmag.cz
        target: newtab
        statusCheckUrl: https://forge.lab.pacmag.cz/api/v1/version

      - title: Glances
        description: Host system monitor
        icon: hl-glances
        url: https://glances.lab.pacmag.cz
        target: newtab

      # Grist isn't in the homelab-svg-assets set (hl-) the other tiles use, so
      # point at the dashboard-icons CDN by full URL.
      - title: Grist
        description: Spreadsheet / database
        icon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/grist.svg
        url: https://grist.lab.pacmag.cz
        target: newtab

      # In neither icon set the tiles above draw from, so use a Font Awesome
      # glyph. The vhost is ungated and the app answers /api/healthcheck without
      # a token, so the status check has something honest to hit.
      - title: Speedtest Tracker
        description: Nightly ISP speed history
        icon: fas fa-gauge-high
        url: https://speed.lab.pacmag.cz
        target: newtab
        statusCheckUrl: https://speed.lab.pacmag.cz/api/healthcheck

      - title: Clouds over Czechoslovakia
        description: Satellite cloud cover
        icon: fas fa-cloud-sun
        url: https://clouds.lab.pacmag.cz/view-dithered.png
        target: newtab
        statusCheckUrl: https://clouds.lab.pacmag.cz/view-dithered.png

      # Served by Caddy itself from a directory rather than proxied to a
      # backend, so there is no health endpoint to check beyond the root
      # listing — which is what the status check hits.
      - title: Files
        description: Static file server (upload over scp)
        icon: fas fa-folder-open
        url: https://files.lab.pacmag.cz
        target: newtab
        statusCheckUrl: https://files.lab.pacmag.cz

      - title: Home Assistant
        description: Home automation
        icon: hl-home-assistant
        url: https://home.lab.pacmag.cz
        target: newtab
        statusCheckUrl: https://home.lab.pacmag.cz

      - title: Zigbee2MQTT
        description: Zigbee bridge
        icon: hl-zigbee2mqtt
        url: https://zigbee.lab.pacmag.cz
        target: newtab
        statusCheckUrl: https://zigbee.lab.pacmag.cz

      # The two tiles here that aren't proxied: both are physical boxes on the
      # LAN with their own admin UIs, so they keep their plain http:// URLs.
      - title: Home router
        description: Kabelbox admin interface
        icon: fas fa-network-wired
        url: http://kabelbox.local
        target: newtab

      # The MikroTik in front of the bench net, reached on its WAN-side address
      # on the home LAN (see lab/README.md). Its default input-chain rules only
      # accept management traffic from the LAN side, so a status check from the
      # OptiPlex would report down even when the router is fine — hence disabled.
      - title: MikroTik
        description: Bench network router (WebFig)
        icon: hl-mikrotik
        url: http://192.168.0.2
        target: newtab
        statusCheck: false
