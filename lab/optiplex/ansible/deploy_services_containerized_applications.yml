---
- name: Deploy Quadlet-managed containers
  hosts: server
  become: yes
  # Caddy (the shared TLS ingress) is deployed separately by deploy_services_caddy.yml,
  # which runs AFTER this play so every backend is up before the proxy forwards.
  # This play still owns the shared `homelab` podman network that Caddy and the
  # backends both join — it must exist first, so it lives with the backends.
  vars:
    quadlet_dir: /etc/containers/systemd
    systemd_dir: /etc/systemd/system
    container_units:
      - voidauth
      - glances
      - dashy
      - grist
      - forgejo
      - speedtest-tracker
      - clouds-over-czechoslovakia-server
      - mosquitto
      - zigbee2mqtt
      - homeassistant
    # Installed like the units above but never started or restarted by this play:
    # they run once and exit, driven by the timers below.
    oneshot_units:
      - clouds-over-czechoslovakia
    # Ordinary service units, copied verbatim rather than generated: these drive
    # podman from the host instead of being a container, so Quadlet has nothing
    # to generate for them. Started by their timers, never by this play.
    systemd_services:
      - podman-prune
    systemd_timers:
      - clouds-over-czechoslovakia
      - podman-prune
  tasks:
    # Podman won't create bind-mount sources, so every service's data dirs have
    # to exist before its unit starts. These tasks only guarantee the directory;
    # they never touch its contents.
    - name: Ensure VoidAuth data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/homelab/voidauth/config
        - /var/lib/homelab/voidauth/db

    # STORAGE_KEY is a secret, so it's templated from the gitignored group_vars
    # into a 0600 env file the container reads (EnvironmentFile in
    # voidauth.container) rather than baked into the committed Quadlet unit.
    - name: Install VoidAuth environment file
      ansible.builtin.template:
        src: templates/voidauth/voidauth.env.j2
        dest: /var/lib/homelab/voidauth/voidauth.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart voidauth

    - name: Ensure Dashy data directory exists
      ansible.builtin.file:
        path: /var/lib/homelab/dashy
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The dashboard is declarative and holds no secrets, so it lives in the repo
    # and is copied verbatim, overwriting whatever is on the host.
    - name: Install Dashy config
      ansible.builtin.copy:
        src: files/dashy/conf.yml
        dest: /var/lib/homelab/dashy/conf.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart dashy

    # Glances keeps no persistent state, so it needs no data directory.

    # Grist runs as uid/gid 1001 inside the container and writes its home DB and
    # documents into the bind mount, so the host directory must be owned by 1001
    # (rootful Podman maps container uid 1001 to host uid 1001). Left root-owned,
    # Grist opens its SQLite DBs read-only and fails with "SQLITE_READONLY:
    # attempt to write a readonly database". `recurse` keeps the play
    # authoritative over the whole tree.
    - name: Ensure Grist data directory exists (owned by the grist uid)
      ansible.builtin.file:
        path: /var/lib/homelab/grist/data
        state: directory
        owner: "1001"
        group: "1001"
        mode: "0755"
        recurse: true

    # GRIST_SESSION_SECRET and GRIST_OIDC_IDP_CLIENT_SECRET are secrets, so
    # they're templated from the gitignored group_vars into a 0600 env file the
    # container reads (EnvironmentFile in grist.container).
    - name: Install Grist environment file
      ansible.builtin.template:
        src: templates/grist/grist.env.j2
        dest: /var/lib/homelab/grist/grist.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart grist

    # Forgejo runs as USER_UID/USER_GID 1000 inside the container, so its
    # bind-mounted data dirs must be owned by uid/gid 1000 on the host. Otherwise
    # the git user can't open gitea.db and the container comes up as a fresh
    # install.
    #
    # No `recurse` here, unlike Grist: this tree is several gigabytes of git
    # objects, packages and artifacts, and walking it on every deploy would cost
    # minutes for nothing.
    - name: Ensure Forgejo data directories exist (owned by the git uid)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - /var/lib/homelab/forgejo/gitea
        - /var/lib/homelab/forgejo/git
        - /var/lib/homelab/forgejo/var

    # The LinuxServer image drops to PUID/PGID 1000 and writes its SQLite DB and
    # Laravel cache into the bind mount, so the host directory must be owned by
    # uid/gid 1000 (rootful Podman maps 1000 straight through). The image chowns
    # /config itself on start, but only once it can enter the directory.
    #
    # No `recurse`: the tree is one small SQLite DB plus a cache the app rewrites
    # constantly, and the top-level ownership is all the entrypoint needs.
    - name: Ensure Speedtest Tracker data directory exists (owned by the app uid)
      ansible.builtin.file:
        path: /var/lib/homelab/speedtest-tracker/config
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    # APP_KEY encrypts data at rest, so it's templated from the gitignored
    # group_vars into a 0600 env file the container reads (EnvironmentFile in
    # speedtest-tracker.container).
    - name: Install Speedtest Tracker environment file
      ansible.builtin.template:
        src: templates/speedtest-tracker/speedtest-tracker.env.j2
        dest: /var/lib/homelab/speedtest-tracker/speedtest-tracker.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart speedtest-tracker

    # Written by the generator container, served read-only by the nginx one.
    - name: Ensure Clouds over Czechoslovakia data directory exists
      ansible.builtin.file:
        path: /var/lib/homelab/clouds-over-czechoslovakia
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Each Forgejo Actions runner bind-mounts /var/lib/homelab/<name> at /data
    # (its config.yml, action cache, workflow workdirs). Podman won't create the
    # bind-mount source, so the dir must exist — owned by the in-container runner
    # user (rootful Podman maps container UID 1000 to host UID 1000).
    - name: Ensure per-runner data dirs exist (owned by the runner uid)
      ansible.builtin.file:
        path: "/var/lib/homelab/{{ item.name }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    # The uuid/token are secrets, so config.yml is templated from the gitignored
    # group_vars at 0600 rather than committed.
    - name: Install per-runner config.yml (entries with placeholder credentials are skipped)
      ansible.builtin.template:
        src: templates/forgejo-runner/config.yml.j2
        dest: "/var/lib/homelab/{{ runner.name }}/config.yml"
        owner: "1000"
        group: "1000"
        mode: "0600"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
      when:
        - runner.uuid != "PASTE_UUID_HERE"
        - runner.token != "PASTE_TOKEN_HERE"
      register: runner_config_files
      # The loop item is the whole runner dict, token included, and Ansible dumps
      # the item verbatim when a task in the loop fails.
      no_log: true

    # Home Assistant keeps everything in one config directory; it runs as root in
    # the container, so no ownership fixup is needed. configuration.yaml and the
    # rest of the tree are edited through the UI and are NOT managed from here —
    # http.yaml below is the one exception.
    - name: Ensure Home Assistant config directory exists
      ansible.builtin.file:
        path: /var/lib/homelab/homeassistant
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Home Assistant has to be told to trust the reverse proxy, and the proxy's
    # subnet is whatever Podman gave the homelab network — so read it back rather
    # than hardcode it.
    - name: Look up the homelab bridge subnet
      ansible.builtin.command:
        cmd: podman network inspect homelab
      register: homelab_network_raw
      changed_when: false

    # Kept out of configuration.yaml (which is hand/UI-edited and unmanaged) and
    # pulled in from there with `http: !include http.yaml`, so the ingress-critical
    # part survives a rebuild while the rest of the file stays the user's.
    - name: Install Home Assistant's proxy-trust config
      ansible.builtin.template:
        src: templates/homeassistant/http.yaml.j2
        dest: /var/lib/homelab/homeassistant/http.yaml
        owner: root
        group: root
        mode: "0644"
      vars:
        homelab_subnet: "{{ (homelab_network_raw.stdout | from_json)[0].subnets[0].subnet }}"
      notify: Restart homeassistant

    - name: Ensure Mosquitto data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/homelab/mosquitto
        - /var/lib/homelab/mosquitto/config

    - name: Install Mosquitto configuration
      ansible.builtin.copy:
        src: files/mosquitto/mosquitto.conf
        dest: /var/lib/homelab/mosquitto/config/mosquitto.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart mosquitto

    # The broker drops to uid/gid 1883 inside the container, so it can only write
    # its persistence DB and log if the host directories are owned by 1883.
    - name: Ensure Mosquitto data and log directories exist (owned by the mosquitto uid)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1883"
        group: "1883"
        mode: "0755"
      loop:
        - /var/lib/homelab/mosquitto/data
        - /var/lib/homelab/mosquitto/log
      notify: Restart mosquitto

    - name: Ensure Zigbee2MQTT data directory exists
      ansible.builtin.file:
        path: /var/lib/homelab/zigbee2mqtt
        state: directory
        owner: root
        group: root
        mode: "0755"

    # `force: false` — this only seeds a first install, skipping the v2 onboarding
    # wizard. Zigbee2MQTT rewrites this file itself (pairings, network key), so
    # after the first deploy the host copy is the source of truth and overwriting
    # it would drop the network.
    - name: Seed Zigbee2MQTT configuration
      ansible.builtin.copy:
        src: files/zigbee2mqtt/configuration.yaml
        dest: /var/lib/homelab/zigbee2mqtt/configuration.yaml
        owner: root
        group: root
        mode: "0644"
        force: false
      notify: Restart zigbee2mqtt

    # Sets the dongle's node to dialout/0660 and adds a /dev/zigbee symlink. The
    # Quadlet unit dials the /dev/serial/by-id/ path instead (created by udev's
    # own serial rules), and rootful Podman runs as root, so nothing currently
    # depends on either — it is here for a rootless or non-by-id setup.
    - name: Install udev rule for the Zigbee dongle
      ansible.builtin.copy:
        src: files/udev/99-zigbee.rules
        dest: /etc/udev/rules.d/99-zigbee.rules
        owner: root
        group: root
        mode: "0644"
      register: zigbee_udev

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      when: zigbee_udev.changed

    - name: Trigger udev for the tty subsystem
      ansible.builtin.command: udevadm trigger --subsystem-match=tty
      when: zigbee_udev.changed

    # Git over SSH is raw TCP, so it cannot be proxied by Caddy the way the web
    # UI is — Forgejo's built-in SSH server publishes host port 2222 directly and
    # needs its own hole in the firewall. It belongs to this play rather than to
    # generic host prep for the same reason 80/443 belong to the Caddy play: the
    # port is dead without the service that binds it.
    - name: Open port 2222 for Forgejo's git-over-SSH
      ansible.posix.firewalld:
        port: 2222/tcp
        permanent: true
        immediate: true
        state: enabled

    # --- Quadlet units ---
    - name: Install network Quadlet unit
      ansible.builtin.copy:
        src: ../quadlet/homelab.network
        dest: "{{ quadlet_dir }}/homelab.network"
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    - name: Install container Quadlet units
      ansible.builtin.copy:
        src: "../quadlet/{{ item }}.container"
        dest: "{{ quadlet_dir }}/{{ item }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ container_units + oneshot_units }}"
      register: quadlet_files
      notify: Reload systemd

    - name: Install per-runner Quadlet units (entries with placeholder credentials are skipped)
      # Runner Quadlets are generated, not copied, because the unit has to embed
      # each runner's chosen name (ContainerName, data Volume path). Everything
      # else about a runner — image, SELinux type, socket mount, labels — is
      # identical across runners, so it lives in the template.
      #
      # Skip placeholder entries: the unit's [Install] WantedBy= would otherwise
      # pull a credential-less runner in at the next boot, where it crash-loops
      # because no config.yml was written for it.
      ansible.builtin.template:
        src: templates/forgejo-runner/runner.container.j2
        dest: "{{ quadlet_dir }}/{{ runner.name }}.container"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ forgejo_runners | default([]) }}"
      loop_control:
        loop_var: runner
        label: "{{ runner.name }}"
      when:
        - runner.uuid != "PASTE_UUID_HERE"
        - runner.token != "PASTE_TOKEN_HERE"
      register: runner_quadlet_files
      notify: Reload systemd
      no_log: true

    - name: Install plain systemd service units
      ansible.builtin.copy:
        src: "files/systemd/{{ item }}.service"
        dest: "{{ systemd_dir }}/{{ item }}.service"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ systemd_services }}"
      notify: Reload systemd

    - name: Install systemd timer units
      ansible.builtin.copy:
        src: "files/systemd/{{ item }}.timer"
        dest: "{{ systemd_dir }}/{{ item }}.timer"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ systemd_timers }}"
      notify: Reload systemd

    # Run the pending daemon-reload before starting units, so systemd sees the
    # latest unit files.
    - name: Apply pending systemd reload
      ansible.builtin.meta: flush_handlers

    - name: Start network
      ansible.builtin.systemd_service:
        name: homelab-network.service
        state: started

    # No `enabled:` here. These units are generated by Quadlet, so systemctl
    # cannot enable or disable them — their [Install] section is what the
    # generator turns into wants-symlinks under /run/systemd/generator/ on every
    # daemon-reload. Passing enabled: false is a silent no-op that reports
    # "changed" on every run and hides the changes that matter.
    - name: Start container services
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: started
      loop: "{{ container_units }}"

    - name: Restart services whose Quadlet unit changed
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        state: restarted
      loop: "{{ quadlet_files.results }}"
      when: item.changed and item.item in container_units
      loop_control:
        label: "{{ item.item }}"

    - name: Start each runner once its credentials are configured
      # WantedBy= in the unit handles auto-start at boot; this start is for the
      # first deploy after credentials are filled in. Entries still on the
      # PASTE_* placeholders have no config.yml and are skipped.
      ansible.builtin.systemd_service:
        name: "{{ item.name }}.service"
        state: started
      loop: "{{ forgejo_runners | default([]) }}"
      when:
        - item.uuid != "PASTE_UUID_HERE"
        - item.token != "PASTE_TOKEN_HERE"
      loop_control:
        label: "{{ item.name }}"
      register: runners_started
      # The loop item is the whole runner dict, token included.
      no_log: true

    # A restart cancels whatever job the runner is executing, so the two restart
    # tasks below must not fire for a runner this run just started from stopped:
    # it came up seconds ago already reading the new unit and config, and by the
    # time the restart tasks run it can have claimed a queued job. Restarting it
    # then fails that job for no reason — which is exactly what a first deploy
    # used to do, three starts in a row.
    - name: Note which runners were started from stopped by this run
      ansible.builtin.set_fact:
        runners_just_started: >-
          {{ runners_started.results | default([])
             | selectattr('changed', 'defined') | selectattr('changed')
             | map(attribute='item.name') | list }}

    - name: Restart runners whose Quadlet changed (only if they were already running)
      ansible.builtin.systemd_service:
        name: "{{ item.runner.name }}.service"
        state: restarted
      loop: "{{ runner_quadlet_files.results | default([]) }}"
      when:
        - item.changed | default(false)
        - item.runner.name not in runners_just_started
      loop_control:
        label: "{{ item.runner.name }}"

    - name: Restart runners whose config.yml changed (only if they were already running)
      # forgejo-runner reads its config only at startup, so a rewritten config.yml
      # (a rotated token, changed labels) has no effect until the daemon restarts.
      # The 'Start each runner' task above is a no-op on an already-running unit,
      # so without this an in-place credential change would silently keep using
      # the stale config.
      ansible.builtin.systemd_service:
        name: "{{ item.runner.name }}.service"
        state: restarted
      loop: "{{ runner_config_files.results | default([]) }}"
      when:
        - item.changed | default(false)
        - item.runner.name not in runners_just_started
      loop_control:
        label: "{{ item.runner.name }}"
      no_log: true

    - name: Enable and start systemd timers
      ansible.builtin.systemd_service:
        name: "{{ item }}.timer"
        state: started
        enabled: true
      loop: "{{ systemd_timers }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart voidauth
      ansible.builtin.systemd_service:
        name: voidauth.service
        state: restarted
      failed_when: false

    - name: Restart dashy
      ansible.builtin.systemd_service:
        name: dashy.service
        state: restarted
      failed_when: false

    - name: Restart grist
      ansible.builtin.systemd_service:
        name: grist.service
        state: restarted
      failed_when: false

    - name: Restart speedtest-tracker
      ansible.builtin.systemd_service:
        name: speedtest-tracker.service
        state: restarted
      failed_when: false

    - name: Restart homeassistant
      ansible.builtin.systemd_service:
        name: homeassistant.service
        state: restarted
      failed_when: false

    - name: Restart mosquitto
      ansible.builtin.systemd_service:
        name: mosquitto.service
        state: restarted
      failed_when: false

    - name: Restart zigbee2mqtt
      ansible.builtin.systemd_service:
        name: zigbee2mqtt.service
        state: restarted
      failed_when: false
